<!-- Listas

Nos ayudan a estructurar información ordenada y no ordenada.

Ordenadas Llevan numeración y la sintaxis es:

<ol>...</ol>

No ordenadas Llevan bullets o viñetas y la sintaxis es:

<ul>...</ul>

Para lo elementos delista se usa la sintaxis:

<il>...</il> 

Existe el atributo ´type´ que permite cambiar el tipo de numeración y bullet de una lista.

1 - Tipo número
a/A - Tipo alfabeto
i/I - Tipo romano

Para las listas no ordenadas los valores son:

bullet - balas o puntitos (default)
circle-circulos
square - cuadros0
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Listas</h1>
<p>Tenemos listas ordenadas y no ordenadas</p>

<h2>Mi comida favorita</h2>
<ol type="I">
    <li>Enchiladas verdes</li>
    <li>Milanesa</li>
    <li>Hamburguesa</li>
</ol>

<h2>Mis pokemones</h2>
<ul type="square">
    <li>Snorlax</li>
    <li>Charizard</li>
    <li>Ditto</li>
</ul>
</html>
