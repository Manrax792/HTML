<!-- Para colocar imagenes dentro de html usamos la rtiqueta:
 
<img />

Esta etiqueta es de autocierre (self closing) Em ht,l 5 la / ya no es necesaria, pero se considera una buena practica utilizarla.

El atributo ´src´ (source u origen) le indica a la etiqueta la imagen a mostrar. Puede recibir una url externa o la ruta (path) interna.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes</title>
</head>
<body>
    <h1>Imagenes</h1>
    <p>Las imagenes nos permite colocar elementos visuales en los sitios web.</p>

<h2>imagen Externa</h2>
<img src="https://picsum.photos/id/237/200/300" />
<h2>Imagen Interna</h2>
<img src="images/imagen.jfif"/> 




</body>
</html>
